<!doctype html><html lang="ru"><style>
.panel.editing .person,.panel.editing .status{display:none}.panel.editing .logo{width:38px;height:38px;border-radius:12px}.panel.editing h3{margin-top:14px}.panel.editing .buttons{margin-top:14px}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#F8FBF7;color:#14251A;font:14px system-ui,sans-serif}.panel{padding:20px 20px max(22px,env(safe-area-inset-bottom));background:linear-gradient(145deg,#F8FBF7,#FFFFFF);border:0}.brand{display:flex;align-items:center;gap:12px}.logo{display:block;width:52px;height:52px;border-radius:16px;object-fit:cover;flex:none}.brand b{display:block;font-size:18px;font-weight:800;letter-spacing:-.5px}.brand small{display:block;margin-top:3px;color:#667B6A;font-size:11px}.refresh{margin-left:auto;border:0;background:#EDF4EC;width:32px;height:32px;padding:0;border-radius:50%;color:#4D6752;font-size:20px}.person{margin-top:22px}h2{margin:0;font-size:20px;line-height:1.25;font-weight:800;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.profile{font-size:12px;color:#667B6A;margin-top:5px}.status{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:6px 10px;border-radius:99px;background:#EDF4EC;font-size:11px;font-weight:700;color:#536C59}.status:before{content:"";width:6px;height:6px;border-radius:50%;background:#829785}.status.on{background:#E7F7E7;color:#16772B}.status.on:before{background:#28B842}#details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.detail{min-width:0;padding:12px;background:#F0F5EF;border-radius:13px}.detail span{display:block;font-size:10px;color:#667B6A;margin-bottom:4px}.detail b{display:block;font-size:17px;line-height:1.35;overflow-wrap:anywhere;font-weight:750}.detail.wide{grid-column:1/-1;background:transparent;padding:0}.detail.wide b{font-size:13px;font-weight:650}h3{font-size:17px;letter-spacing:-.3px;margin:20px 0 7px}.hint{font-size:12px;color:#667B6A;line-height:1.5}.buttons{display:flex;flex-direction:column;gap:8px;margin-top:20px}button{border:0;border-radius:15px;padding:13px 14px;background:#EDF4EC;color:#26432D;font:650 13px system-ui,sans-serif;cursor:pointer}.primary{min-height:50px;background:#35D33A;color:#102C16;font-size:14px;font-weight:800}.secondary{background:transparent;padding:7px;color:#667B6A;font-size:12px}.choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.choices button{font-size:11px;padding:8px 10px;border-radius:10px}.foot{margin-top:8px;text-align:center}.foot button{background:transparent;padding:10px 0 3px;font-size:11px;color:#667B6A}button:disabled{opacity:.5}#notice{font-size:12px;color:#8A3D37;line-height:1.45;margin-top:10px;overflow-wrap:anywhere}#notice:empty,h3:empty,.hint:empty,.choices:empty{display:none}
</style><body><div class="panel"><div class="brand"><img class="logo" src="__BRAND_IMAGE__" alt="бибибайк"><div><b>бибибайк</b><small>Моя смена</small></div><button class="refresh" id="refresh" aria-label="Обновить">↻</button></div><div class="person"><h2 id="name">Загружаем…</h2><div class="profile" id="profile"></div></div><div class="status" id="status"></div><div id="details"></div><h3 id="heading"></h3><div class="hint" id="hint"></div><div class="choices" id="choices"></div><div id="notice" role="status"></div><div class="buttons" id="buttons"></div><div class="foot"><button id="app">Открыть приложение ↗</button></div></div>
<script>
const W=TelegramWidget,$=id=>document.getElementById(id);let state=null,busy=false;
function button(text,action,cls='secondary'){const b=document.createElement('button');b.textContent=text;b.className=cls;b.disabled=busy;b.onclick=()=>ask(action);return b}
function detail(label,value,wide=false){if(!value)return;const el=document.createElement('div');el.className='detail'+(wide?' wide':'');const l=document.createElement('span'),v=document.createElement('b');l.textContent=label;v.textContent=value;el.append(l,v);$('details').appendChild(el)}
function draw(){if(!state)return;document.querySelector('.panel').className='panel'+(state.step?' editing':'');$('name').textContent=state.n;$('profile').textContent=`${state.c} · ${state.role}`;const status=$('status');status.textContent=({idle:'Смена не открыта',active:'На смене',waiting:'Ожидает начала',closed:'Смена закрыта'})[state.s]||'';status.className='status'+(state.sid?' on':'');$('details').replaceChildren();const step=state.step||'';detail('Дата',state.date);detail(state.time?(step.startsWith('stop_')?'Окончание':'Начало'):'Начало',state.time||state.start||'—');if(state.end)detail('Окончание',state.end);detail('Район / зона',state.d,true);$('heading').textContent=({start_time:'Во сколько начали?',start_district:'В каком районе?',start_confirm:'Всё верно?',stop_time:'Во сколько закончили?',stop_confirm:'Завершить смену?'})[step]||'';$('hint').textContent=({start_time:'Нажмите «Сейчас» или напишите время боту: 09:00.',start_district:'Выберите район или напишите его сообщением боту.',start_confirm:'Проверьте время и район перед открытием.',stop_time:'Нажмите «Сейчас» или напишите время окончания боту.',stop_confirm:'Подтвердите время — бот сохранит итоговый отчёт.'})[step]||'';$('notice').textContent=busy?'Сохраняем…':state.msg||'';$('buttons').replaceChildren();$('choices').replaceChildren();if(step==='start_time'||step==='stop_time'){$('buttons').append(button('Сейчас','now','primary'),button('Отмена','cancel'))}else if(step==='start_district'){(state.opts||[]).forEach((d,i)=>$('choices').appendChild(button(d,`d${i}`,'')));$('buttons').appendChild(button('Отмена','cancel'))}else if(step==='start_confirm'||step==='stop_confirm'){$('buttons').append(button(step==='start_confirm'?'Открыть смену':'Закрыть смену','commit','primary'),button('Отмена','cancel'))}else{$('buttons').appendChild(button(state.sid?'Закрыть смену':'Открыть смену',state.sid?'close':'open','primary'))}$('refresh').disabled=busy}
function accept(){try{const next=JSON.parse(W.chatData||'null');if(next){state=next;busy=false;draw()}}catch(_){$('notice').textContent='Не удалось прочитать карточку. Отправьте /start.'}}
function ask(action){if(busy||!state)return;busy=true;draw();let request;try{request=W.request(`sw:${state.k}:${state.r}:${action}:${state.sid}`)}catch(_){busy=false;draw();$('notice').textContent='Не удалось отправить. Нажмите ↻.';return}const revision=state.r;setTimeout(()=>{if(busy&&state.r===revision){busy=false;draw();$('notice').textContent='Нажмите ↻, чтобы проверить смену.'}},12000);request.then(a=>{let result={};try{result=JSON.parse(a.result||'{}')}catch(_){}if(!result.pending){busy=false;draw();if(result.error)$('notice').textContent=result.error}},()=>{busy=false;draw();$('notice').textContent='Нет ответа. Нажмите ↻ и проверьте смену.'})}
$('refresh').onclick=()=>ask('refresh');$('app').onclick=()=>W.openTelegramLink(__APP_URL__);W.onEvent('chatDataChanged',accept);accept();W.ready();if(state)ask('refresh');
</script></body></html>

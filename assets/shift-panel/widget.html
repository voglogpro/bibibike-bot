<!doctype html><html lang="ru"><style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#0A100C;color:#0E1A10;font:14px system-ui,sans-serif}.panel{padding:18px;border-radius:24px;background:#F1F4EA}.brand{color:#16A02A;font-size:12px;font-weight:800;margin-bottom:14px}.head{display:flex;gap:12px;align-items:center}.mark{width:44px;height:44px;border-radius:14px;background:#35D33A;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;flex:none}.who{min-width:0}h2{margin:0;font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.profile{font-size:12px;color:#526955;margin-top:4px}.status{display:flex;justify-content:space-between;gap:10px;background:#fff;border:1px solid #E2E7DA;border-radius:14px;padding:12px;margin:16px 0;font-size:12px}.status b{color:#147B23}.muted{color:#526955;font-size:12px;line-height:1.5}.detail{display:flex;justify-content:space-between;gap:14px;margin:10px 0;font-size:13px}.detail b{text-align:right;overflow-wrap:anywhere}h3{font-size:17px;margin:15px 0 8px}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}button{border:0;border-radius:14px;padding:13px 14px;background:#fff;color:#0E1A10;font-size:13px;font-weight:750;cursor:pointer}.buttons button{flex:1}.primary{background:#35D33A;color:#0B140E}.choices{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.choices button{font-size:12px;padding:9px 11px}.foot{display:flex;gap:14px;margin-top:14px}.foot button{background:transparent;padding:4px 0;font-size:11px;color:#526955}button:disabled{opacity:.5}#notice{color:#8A3434;font-size:12px;line-height:1.45;margin-top:10px;overflow-wrap:anywhere}
</style><body><div class="panel"><div class="brand">бибибайк · Моя смена</div><div class="head"><div class="mark">бб.</div><div class="who"><h2 id="name">Загружаем…</h2><div class="profile" id="profile"></div></div></div><div class="status"><span>Статус</span><b id="status"></b></div><div class="muted" id="date"></div><div id="details"></div><h3 id="heading"></h3><div class="muted" id="hint"></div><div class="choices" id="choices"></div><div id="notice" role="status"></div><div class="buttons" id="buttons"></div><div class="foot"><button id="refresh">Обновить</button><button id="app">Открыть приложение</button></div></div>
<script>
const W=TelegramWidget,$=id=>document.getElementById(id);let state=null,busy=false;
function button(text,action,cls=''){const b=document.createElement('button');b.textContent=text;b.className=cls;b.disabled=busy;b.onclick=()=>ask(action);return b}
function detail(label,value){if(!value)return;const el=document.createElement('div');el.className='detail';const l=document.createElement('span'),v=document.createElement('b');l.textContent=label;v.textContent=value;el.append(l,v);$('details').appendChild(el)}
function draw(){if(!state)return;$('name').textContent=state.n;$('profile').textContent=`${state.c} · ${state.role}`;$('date').textContent=state.date;$('status').textContent=({idle:'Смена не открыта',active:'На смене',waiting:'Ожидает начала',closed:'Смена закрыта'})[state.s]||'';$('details').replaceChildren();detail('Начало',state.start);detail('Окончание',state.end);detail('Район / зона',state.d);const step=state.step||'';if(state.time)detail(step.startsWith('stop_')?'Закрыть в':'Открыть в',state.time);$('heading').textContent=({start_time:'Во сколько начали?',start_district:'В каком районе?',start_confirm:'Открыть смену?',stop_time:'Во сколько закончили?',stop_confirm:'Закрыть смену?'})[step]||'';$('hint').textContent=({start_time:'Отправьте боту время, например 09:00, или нажмите «Сейчас».',start_district:'Напишите район обычным сообщением боту или выберите ниже.',start_confirm:'Проверьте время и район перед открытием.',stop_time:'Отправьте боту время окончания или нажмите «Сейчас».',stop_confirm:'Проверьте время. После подтверждения бот сохранит отчёт.'})[step]||'';$('notice').textContent=busy?'Сохраняем…':state.msg||'';$('buttons').replaceChildren();$('choices').replaceChildren();if(step==='start_time'||step==='stop_time'){$('buttons').append(button('Сейчас','now','primary'),button('Отмена','cancel'))}else if(step==='start_district'){(state.opts||[]).forEach((d,i)=>$('choices').appendChild(button(d,`d${i}`)));$('buttons').appendChild(button('Отмена','cancel'))}else if(step==='start_confirm'||step==='stop_confirm'){$('buttons').append(button(step==='start_confirm'?'Открыть смену':'Закрыть смену','commit','primary'),button('Отмена','cancel'))}else{$('buttons').appendChild(button(state.sid?'Закрыть смену':'Открыть смену',state.sid?'close':'open','primary'))}$('refresh').disabled=busy}
function accept(){try{const next=JSON.parse(W.chatData||'null');if(next){state=next;busy=false;draw()}}catch(_){$('notice').textContent='Не удалось прочитать карточку. Отправьте /start.'}}
function ask(action){if(busy||!state)return;busy=true;draw();let request;try{request=W.request(`sw:${state.k}:${state.r}:${action}:${state.sid}`)}catch(_){busy=false;draw();$('notice').textContent='Не удалось отправить. Нажмите «Обновить».';return}const revision=state.r;setTimeout(()=>{if(busy&&state.r===revision){busy=false;draw();$('notice').textContent='Нажмите «Обновить», чтобы проверить смену.'}},12000);request.then(a=>{let result={};try{result=JSON.parse(a.result||'{}')}catch(_){}if(!result.pending){busy=false;draw();if(result.error)$('notice').textContent=result.error}},()=>{busy=false;draw();$('notice').textContent='Нет ответа. Нажмите «Обновить» и проверьте смену.'})}
$('refresh').onclick=()=>ask('refresh');$('app').onclick=()=>W.openTelegramLink(__APP_URL__);W.onEvent('chatDataChanged',accept);accept();W.ready();if(state)ask('refresh');
</script></body></html>
